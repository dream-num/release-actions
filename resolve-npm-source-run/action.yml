name: Resolve an Insider publishing run
description: Read the newest successful source attempt and its exact release receipt.
inputs:
  repository:
    description: Source repository owner/name
    required: true
  run-id:
    description: Exact run ID; mutually exclusive with workflow and tag
    required: false
  workflow:
    description: Source workflow filename, required for tag selection
    required: false
  tag:
    description: Exact Git tag, required for tag selection
    required: false
  producer:
    description: Trusted caller JSON defining repository ID, workflow, ref, publish job and allowed packages
    required: true
  token:
    description: Optional source repository source read token (Actions, and Contents for tag lookup)
    required: false
outputs:
  batch:
    description: Exact batch derived from the producer receipt
    value: ${{ steps.resolve.outputs.batch }}
  attempt:
    description: Verified latest successful attempt
    value: ${{ steps.resolve.outputs.attempt }}
  run-id:
    description: Verified source run ID
    value: ${{ steps.resolve.outputs.run_id }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SOURCE_RUN_ID: ${{ inputs.run-id }}
        SOURCE_WORKFLOW: ${{ inputs.workflow }}
        SOURCE_TAG: ${{ inputs.tag }}
        SOURCE_PRODUCER: ${{ inputs.producer }}
        SOURCE_ACTIONS_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/resolve.mjs"
