name: Assemble exact Insider npm batch
description: Read exact Insider package metadata and output expected digests without downloading archives.
inputs:
  selection:
    description: JSON with exact name/version entries; optional tag defaults to latest.
    required: true
outputs:
  batch:
    description: Exact checked promotion manifest.
    value: ${{ steps.assemble.outputs.batch }}
runs:
  using: composite
  steps:
    - id: assemble
      shell: bash
      env:
        ACTION_SELECTION: ${{ inputs.selection }}
      run: node "$GITHUB_ACTION_PATH/assemble.mjs"
