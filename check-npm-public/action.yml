name: Check exact npm package visibility
description: Read exact public metadata and optionally verify actual tarball SHA-512.
inputs:
  package:
    description: Exact npm package name
    required: true
  version:
    description: Exact SemVer version
    required: true
  integrity:
    description: Expected SHA-512 integrity
    required: true
  verify-tarball:
    description: Independently hash the exact public tarball when true
    default: 'false'
outputs:
  status:
    description: visible_match, not_visible, or mismatch
    value: ${{ steps.check.outputs.status }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        ACTION_PACKAGE: ${{ inputs.package }}
        ACTION_VERSION: ${{ inputs.version }}
        ACTION_INTEGRITY: ${{ inputs.integrity }}
        ACTION_VERIFY_TARBALL: ${{ inputs.verify-tarball }}
      run: node "$GITHUB_ACTION_PATH/check.mjs"
